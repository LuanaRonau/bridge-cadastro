name: Monitor de Milestones (fechamento de issues)

on:
  schedule:
    # Roda a cada 10 minutos. Ajuste conforme a urgência que você precisa.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Precisa de permissão de escrita para commitar o arquivo de estado de volta no repo
permissions:
  contents: write

concurrency:
  group: monitor-milestones
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests PyYAML

      - name: Rodar monitor
        env:
          # PAT (classic ou fine-grained) com escopo de leitura em repo + projects
          # Precisa ter acesso de leitura aos repositórios listados no config.yaml
          GH_MONITOR_TOKEN: ${{ secrets.GH_MONITOR_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/monitor_milestones.py

      - name: Commitar estado atualizado
        run: |
          git config user.name "milestone-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza estado do monitor de milestones [skip ci]"
            git push
          else
            echo "Nada para commitar."
          fi
